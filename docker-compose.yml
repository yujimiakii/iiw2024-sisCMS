#Etapa 1 - Banco de dados - MariaDB
name: cms-sisCMS

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dados-do-banco:/var/lib/mysql
    volumes:
      dados-do-banco:

  #Etapa 2 - WORDPRESS
  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - site-wordpress:/var/www/html
    depends_on:
      - db

  WORDPRESS_CONFIG_EXTRA
    if (isset($$_SERVER['HTTP_HOST'])) {
        define('WP_HOME',     'https://' . $$_SERVER['HTTP_HOST']);
        define('WP_SITEURL',  'https://' . $$_SERVER['HTTP_HOST']);
      }
      $$_SERVER['HTTPS'] = 'on';

#Etapa 3 - Joomla
joomla: 
  image: joomla:5-php8.3-apache
  restart: unless-stopped
  ports:
    - "8080:80"
  environment:
    JOOMLA_DB_HOST: db
    JOOMLA_DB_NAME: ${DB_NAME}
    JOOMLA_DB_USER: ${DB_USER}
    JOOMLA_DB_PASSWORD: ${DB_PASSWORD}
  volumes:
    - site-joomla:/var/www/html
  depends_on:
    - db

#Etapa 4 - Qual serviço levantar
  volumes:
    dados-do-banco:
    site-wordpress: # ou site-joomla:




    

  
